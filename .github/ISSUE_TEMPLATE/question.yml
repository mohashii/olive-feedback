name: Question
description: Ask how something works
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        The [user guide](https://olive-markdown.pages.dev/guide/) covers how to use Olive on the Mac and in VS Code, the
        [FAQ](https://olive-markdown.pages.dev/guide/faq) covers what Olive does and does not do, and
        [Troubleshooting](https://olive-markdown.pages.dev/guide/troubleshooting) covers the common "it isn't working" cases.
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: input
    id: version-olive
    attributes:
      label: Olive version
      description: If the answer might depend on it.
      placeholder: "0.1.0"
