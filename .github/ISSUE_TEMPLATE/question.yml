name: Question
description: Ask how something works
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        The [user guide](https://github.com/mohashii/olive-feedback/blob/main/guide/README.md) covers how to use Olive on the Mac and in VS Code, the
        [FAQ](https://github.com/mohashii/olive-feedback/blob/main/guide/faq.md) covers what Olive does and does not do, and
        [Troubleshooting](https://github.com/mohashii/olive-feedback/blob/main/guide/troubleshooting.md) covers the common "it isn't working" cases.
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: input
    id: version-olive
    attributes:
      label: Olive version
      description: If the answer might depend on it.
      placeholder: "0.1.0"
